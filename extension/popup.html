<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* Same tokens as the dashboard's dark theme and the on-page HUD, so all three
     surfaces read as one product. */
  :root {
    --void:   #14120e;
    --shell:  #191612;
    --raised: #221e18;
    --seam:   #322c23;
    --ink:    #ece4d6;
    --ash:    #a99e8b;
    --faint:  #74695a;
    --ember:  #8aa6dc;
    --clear:  #6aa878;
    --halt:   #d7614f;

    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 288px;
    font-family: var(--sans);
    background: var(--void);
    color: var(--ink);
    font-size: 13px;
  }

  .wrap { padding: 16px; display: flex; flex-direction: column; gap: 9px; }

  h1 {
    display: flex; align-items: center; gap: 9px;
    font-size: 13px; font-weight: 600; margin-bottom: 4px;
  }
  h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ember); }

  /* Protection state is shown, not offered. It is the parent's decision, made in
     the dashboard, so there is deliberately no control here to switch it off. */
  .status-row {
    display: flex; align-items: center; gap: 11px;
    padding: 13px 14px; background: var(--shell);
    border: 1px solid var(--seam); border-radius: 2px;
  }
  .status-dot {
    width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
    background: var(--faint);
  }
  .status-dot.on  { background: var(--clear); box-shadow: 0 0 0 4px rgba(76,186,117,.14); }
  .status-dot.off { background: var(--halt);  box-shadow: 0 0 0 4px rgba(222,109,96,.14); }
  .status-title { font-size: 13.5px; font-weight: 600; }
  .status-note  { font-size: 11px; color: var(--faint); margin-top: 2px; line-height: 1.4; }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 14px; background: var(--shell);
    border: 1px solid var(--seam); border-radius: 2px;
    font-size: 13px; color: var(--ash);
  }

  .switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: var(--seam); border-radius: 20px; transition: .15s;
  }
  .slider:before {
    content: ""; position: absolute; height: 14px; width: 14px;
    left: 3px; bottom: 3px; background: var(--ash);
    border-radius: 50%; transition: .15s;
  }
  input:checked + .slider { background: var(--ember); }
  input:checked + .slider:before { transform: translateX(16px); background: #fff; }
  input:focus-visible + .slider { outline: 2px solid var(--ember); outline-offset: 2px; }

  button {
    font-family: var(--sans); cursor: pointer; border-radius: 2px;
    transition: filter .15s, border-color .15s, color .15s;
  }
  #scanBtn {
    width: 100%; padding: 11px; border: none;
    background: var(--ember); color: #10151f;
    font-weight: 600; font-size: 13px;
  }
  #scanBtn:hover { filter: brightness(1.08); }

  #clearBlockedBtn {
    width: 100%; padding: 10px; border: 1px solid var(--seam);
    background: transparent; color: var(--ash);
    font-weight: 500; font-size: 12.5px;
  }
  #clearBlockedBtn:hover { border-color: var(--halt); color: var(--halt); }

  #scanStatus {
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint);
    text-align: center; min-height: 13px;
  }

  #dashboardLink {
    text-align: center; font-size: 12.5px; color: var(--faint);
    padding: 12px; cursor: pointer; border-top: 1px solid var(--seam);
  }
  #dashboardLink:hover { color: var(--ember); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span>Dhvanyartha Guard</h1>

  <div class="status-row" id="guardStatusRow">
    <span class="status-dot" id="guardDot"></span>
    <div>
      <div class="status-title" id="guardStatus">Checking...</div>
      <div class="status-note">Set by the parent dashboard</div>
    </div>
  </div>

  <div class="toggle-row">
    <span>Show floating status</span>
    <label class="switch">
      <input type="checkbox" id="toolbarToggle">
      <span class="slider"></span>
    </label>
  </div>

  <button id="scanBtn">Scan this page now</button>
  <button id="clearBlockedBtn">Clear blocked pages</button>
  <div id="scanStatus"></div>
</div>
<div id="dashboardLink">Open parent dashboard</div>

<script src="popup.js"></script>
</body>
</html>
