<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    width: 260px;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fafaf8;
    color: #1c1c1e;
  }
  .wrap { padding: 16px; }
  h1 {
    font-size: 15px;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h1 .dot { width: 7px; height: 7px; border-radius: 50%; background: #c96442; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    background: #fff;
    border: 1px solid #e9e7e2;
    border-radius: 10px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .switch { position: relative; width: 36px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: #d8d5cd; border-radius: 20px; transition: 0.15s;
  }
  .slider:before {
    content: ""; position: absolute; height: 14px; width: 14px;
    left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.15s;
  }
  input:checked + .slider { background: #c96442; }
  input:checked + .slider:before { transform: translateX(16px); }

  #scanBtn {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: #c96442;
    color: #fff;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  #scanBtn:hover { filter: brightness(1.06); }
  #scanStatus { font-size: 12px; color: #86868b; text-align: center; margin-bottom: 10px; min-height: 14px; }

  #dashboardLink {
    display: block;
    text-align: center;
    font-size: 12.5px;
    color: #86868b;
    padding: 8px;
    cursor: pointer;
    border-top: 1px solid #e9e7e2;
  }
  #dashboardLink:hover { color: #c96442; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span>Dhvanyartha Guard</h1>

  <div class="toggle-row">
    <span>Protection active</span>
    <label class="switch">
      <input type="checkbox" id="guardToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span>Show floating toolbar</span>
    <label class="switch">
      <input type="checkbox" id="toolbarToggle">
      <span class="slider"></span>
    </label>
  </div>

  <button id="scanBtn">Scan this page now</button>
  <div id="scanStatus"></div>
</div>
<div id="dashboardLink">Open parent dashboard</div>

<script src="popup.js"></script>
</body>
</html>
